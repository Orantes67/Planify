name: Deploy Angular App to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Install Angular CLI
      - name: Install Angular CLI
        run: npm install -g @angular/cli

      # Step 5: Build Angular app
      - name: Build Angular app
        run: npm run build --prod

      # Step 6: Setup SSH Key
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -t rsa ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Step 7: Remove old files from EC2 target directory
      - name: Remove old files from EC2
        run: ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "rm -rf /var/www/angular/browser/*"

      # Step 8: Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: dist/planify/browser/*
          target: /var/www/angular/browser/

      # Step 9: Reload Nginx
      - name: Reload Nginx
        run: ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "sudo systemctl reload nginx"
