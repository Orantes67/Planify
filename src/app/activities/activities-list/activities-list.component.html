<div class="p-4">
   
    <div *ngIf="actividades.length === 0" class="text-center text-gray-500">
      No hay actividades disponibles.
    </div>
  
    <div *ngFor="let actividad of actividades" class="border border-gray-300 rounded-lg p-4 mb-4 flex justify-between items-center">
      <div>
        <h3 class="text-lg font-semibold">{{ actividad.nombre }}</h3>
        <p class="text-sm text-gray-500">
          {{ actividad.fecha_inicio }} - {{ actividad.hora_inicio }}
        </p>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-500">{{ actividad.fecha_fin }}</span>
        <button class="text-gray-500">
          <i class="fas fa-ellipsis-h"></i>
        </button>
      </div>
    </div>
  
 
    <div class="flex justify-center mt-4" *ngIf="actividades.length > 0">
      <button class="flex items-center gap-2 px-4 py-2 bg-purple-100 text-purple-700 rounded-lg">
        <i class="fas fa-arrow-down"></i>
        Ver más
      </button>
    </div>
  </div>
