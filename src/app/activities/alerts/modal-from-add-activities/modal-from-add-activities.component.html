<div
  class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center z-50">
  <div
    class="bg-purple-200 rounded-lg shadow-lg w-96 p-6 relative">
    <button
      class="absolute top-2 right-2 text-gray-600 hover:text-gray-900"
      (click)="cerrar.emit()">
      &times;
    </button>
    <h2 class="text-xl font-bold text-center mb-4">Agregar nueva actividad</h2>
    <form (ngSubmit)="crearActividad()">
      <!-- Contenido -->
      <div class="mb-4">
        <label for="nombre" class="block text-gray-700">Titulo</label>
        <textarea
          id="nombre"
          [(ngModel)]="actividad.nombre"
          name="contenido"
          rows="3"
          class="w-full border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-purple-500"
          (blur)="touched.nombre = true"
          required>
        </textarea>
        <div *ngIf="touched.nombre && !actividad.nombre.trim()" class="text-red-500 text-xs">
          Este campo es obligatorio.
        </div>
      </div>
      

      <div class="flex gap-2"> 
        <div class="mb-4">
          <label for="fecha_inicio" class="block text-gray-700">Fecha inicio</label>
          <input
            id="fecha_inicio"
            type="date"
            [(ngModel)]="actividad.fecha_inicio"
            name="fecha_inicio"
            class="w-40 border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-purple-500"
            (blur)="touched.fecha_inicio = true"
            required>
          <div *ngIf="touched.fecha_inicio && !actividad.fecha_inicio.trim()" class="text-red-500 text-xs">
            Este campo es obligatorio.
          </div>
        </div>
  
      <div class="mb-4">
        <label for="fecha_fin" class="block text-gray-700">Fecha fin</label>
        <input
          id="fecha_fin "
          type="date"
          [(ngModel)]="actividad.fecha_fin"
          name="id_familia"
          class="w-40   border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-purple-500"
          (blur)="touched.fecha_fin = true"
          required />
          <div *ngIf="touched.fecha_fin && !actividad.fecha_fin" class="text-red-500 text-xs">
            Este campo es obligatorio.
          </div>
      </div>
    </div>

    <div class="flex gap-2" >
      <div class="mb-4">
        <label for="hora_inicio" class="block text-gray-700">Hora inicio</label>
        <input
          id="hora_inicio"
          type="time"
          [(ngModel)]="actividad.hora_inicio"
          name="hora_limite"
          class="w-40  border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-purple-500"
          (blur)="touched.hora_inicio = true"
          required />
          <div *ngIf="touched.hora_inicio && !actividad.hora_inicio.trim()" class="text-red-500 text-xs ">
            Este campo es obligatorio.
          </div>
      </div>
  
         <div class="mb-4">
          <label for="hora_fin" class="block text-gray-700">Hora fin</label>
          <input
            id="hora_fin"
            type="time"
            [(ngModel)]="actividad.hora_fin"
            name="hora_limite"
            class="w-40  border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-purple-500"
            (blur)="touched.hora_fin = true"
            required />
            <div *ngIf="touched.hora_fin && !actividad.hora_fin" class="text-red-500 text-xs">
              Este campo es obligatorio.
            </div>
        </div>
      </div>
     
      <button
        type="submit"
        class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
        Crear
      </button>
    </form>
  </div>
</div>
