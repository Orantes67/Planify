<div class="">
    <h2 class="text-xl font-bold mb-4">Próximos Recordatorios</h2>
    <div class="flex flex-col space-y-4">
      <div
        *ngFor="let recordatorio of notificaciones"
        class="flex justify-between items-center border-b pb-4"
      >
        <div class="flex flex-col">
          <!-- Mostrar la hora -->
          <span class="text-gray-600 text-sm">{{ (recordatorio.fecha_hora) }}</span>
          
          <!-- Mostrar la categoría -->
          <span class="font-bold text-purple-500">{{ recordatorio.categoria }}</span>
          
          <!-- Mostrar el título -->
          <span class="font-medium text-black">{{ recordatorio.titulo }}</span>
          
          <!-- Mostrar el contenido -->
          <span class="text-gray-700 text-sm">{{ recordatorio.contenido }}</span>
        </div>
        <button
          class="bg-purple-700 w-6 h-6 rounded-full flex items-center justify-center"
        >
          <span class="material-icons text-white text-sm">check</span>
        </button>
      </div>
    </div>
  </div>
