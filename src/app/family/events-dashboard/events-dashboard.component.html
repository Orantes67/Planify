<!-- Contenedor principal -->
<div *ngIf="familyId" class="p-6 bg-yellow-100 rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4">Eventos de la Familia</h2>
  
    <!-- Botón para abrir modal de agregar evento -->
    <div class="mb-6">
      <button
        *ngIf="userRole === 'lider'"
        (click)="openAddEventModal()"
        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
      >
        Agregar Evento
      </button>
    </div>
  
    <!-- Lista de eventos con barra de desplazamiento -->
    <div>
      <h3 class="text-lg font-semibold mb-2">Lista de Eventos</h3>
      <div class="max-h-64 overflow-y-auto border border-gray-300 rounded-lg p-2">
        <ul>
          <li
            *ngFor="let event of events"
            class="p-4 mb-2 bg-lime-100 rounded-lg shadow"
          >
            <div class="flex justify-between items-center">
              <div>
                <h4 class="text-lg font-bold">{{ event.nombre }}</h4>
                <p>{{ event.fecha_inicio }} - {{ event.fecha_fin }}</p>
              </div>
              <!-- Botones de acciones solo para líderes -->
              <div *ngIf="userRole === 'lider'" class="flex gap-2">
                <button
                  (click)="openEditModal(event)"
                  class="bg-yellow-500 text-white px-2 py-1 rounded hover:bg-yellow-600"
                >
                  Editar
                </button>
                <button
                  (click)="openDeleteModal(event.evento_id!)"
                  class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600"
                >
                  Eliminar
                </button>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
  
  <!-- Modal para Agregar Evento -->
  <div
    *ngIf="isAddEventModalOpen"
    class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50"
  >
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
      <h3 class="text-lg font-bold mb-4">Agregar Evento</h3>
      <form (ngSubmit)="createEvent()">
        <input
          type="text"
          [(ngModel)]="newEvent.nombre"
          name="nombre"
          placeholder="Nombre del evento"
          class="p-2 border rounded w-full mb-4"
          required
        />
        <input
          type="date"
          [(ngModel)]="newEvent.fecha_inicio"
          name="fecha_inicio"
          class="p-2 border rounded w-full mb-4"
          required
        />
        <input
          type="date"
          [(ngModel)]="newEvent.fecha_fin"
          name="fecha_fin"
          class="p-2 border rounded w-full mb-4"
          required
        />
        <div class="flex justify-end gap-2">
          <button
            type="button"
            (click)="closeAddEventModal()"
            class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
          >
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Modal para Editar Evento -->
  <div
    *ngIf="isEditModalOpen"
    class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50"
  >
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
      <h3 class="text-lg font-bold mb-4">Editar Evento</h3>
      <form (ngSubmit)="updateEvent()">
        <input
          type="text"
          [(ngModel)]="selectedEvent!.nombre"
          name="nombre"
          placeholder="Nombre del evento"
          class="p-2 border rounded w-full mb-4"
          required
        />
        <input
          type="date"
          [(ngModel)]="selectedEvent!.fecha_inicio"
          name="fecha_inicio"
          class="p-2 border rounded w-full mb-4"
          required
        />
        <input
          type="date"
          [(ngModel)]="selectedEvent!.fecha_fin"
          name="fecha_fin"
          class="p-2 border rounded w-full mb-4"
          required
        />
        <div class="flex justify-end gap-2">
          <button
            type="button"
            (click)="closeEditModal()"
            class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
          >
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Modal de Confirmación para Eliminar -->
  <div
    *ngIf="isDeleteModalOpen"
    class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50"
  >
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
      <h3 class="text-lg font-bold mb-4">Confirmar Eliminación</h3>
      <p>¿Estás seguro de que deseas eliminar este evento?</p>
      <div class="flex justify-end gap-2 mt-4">
        <button
          type="button"
          (click)="closeDeleteModal()"
          class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
        >
          Cancelar
        </button>
        <button
          (click)="confirmDeleteEvent()"
          class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
        >
          Eliminar
        </button>
      </div>
    </div>
  </div>
