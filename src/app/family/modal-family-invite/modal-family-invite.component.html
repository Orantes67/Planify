<div
  class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50 z-50"
>
  <div
    class="bg-white rounded-lg shadow-lg w-full max-w-md p-6"
  >
    <h2 class="text-lg font-semibold mb-4 text-center">
      Invitar a {{ data.familyName }}
    </h2>
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">
        Correo Electrónico:
      </label>
      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        class="mt-2 p-2 block w-full rounded-md border-gray-300 shadow-sm focus:ring-purple-500 focus:border-purple-500 text-sm"
        placeholder="example@domain.com"
      />
    </div>
    <div class="mt-6 flex justify-end gap-4">
      <button
        (click)="closeDialog()"
        class="bg-gray-400 text-white px-4 py-2 rounded-lg hover:bg-gray-500 transition duration-300"
      >
        Cancelar
      </button>
      <button
        (click)="confirmInvite()"
        class="bg-purple-400 text-white px-4 py-2 rounded-lg hover:bg-purple-500 transition duration-300"
      >
        Invitar
      </button>
    </div>
  </div>
</div>
