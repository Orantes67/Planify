<div class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-purple-200 rounded-lg shadow-lg w-96 p-6 relative">
  
    <!-- Close Button -->
    <button 
      class="absolute top-2 right-2 text-gray-600 hover:text-gray-900 text-[30px]" 
      (click)="onClose()"> 
      &times;
    </button> 

    <!-- Title -->
    <h1 class="text-xl font-bold text-center mb-4">Invitar a {{ data.familyName }}</h1>

    <!-- Email Input Field -->
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700">Correo Electrónico:</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        class="mt-2 p-2 block w-full rounded-md border-gray-300 shadow-sm focus:ring-purple-500 focus:border-purple-500 text-sm"
        placeholder="example@domain.com"
      />
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-center mt-6">
      <button
        (click)="confirmInvite()"
        class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition duration-300"
      >
        Invitar
      </button>
    </div>
  
  </div>
</div>
