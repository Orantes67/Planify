<form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-4">
  <input
    type="text"
    formControlName="correo"
    placeholder="Correo"
    class="input-field"
  />
  <div
    *ngIf="loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched"
    class="text-red-500"
  >
    El correo es requerido.
  </div>

  <input
    type="password"
    formControlName="contrasena"
    placeholder="Contraseña"
    class="input-field"
  />
  <div
    *ngIf="
      loginForm.get('contrasena')?.invalid &&
      loginForm.get('contrasena')?.touched
    "
    class="text-red-500"
  >
    Contraseña es requerida y debe tener al menos 6 caracteres.
  </div>

  <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
    Iniciar Sesión
  </button>
  <p class="text-red-500 mt-2" *ngIf="errorMessage">{{ errorMessage }}</p>
</form>
