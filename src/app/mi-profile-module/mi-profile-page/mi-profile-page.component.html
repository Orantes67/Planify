<div class="w-full h-screen flex justify-center items-center bg-gray-50">
    <div class="w-3/4 bg-white shadow-md rounded-md p-8">
      <div class="flex items-center space-x-8">
        <!-- Imagen de perfil -->
        <div>
          <img
            [src]="
              user.imageid
                ? imageService.getImageById(user.imageid)
                : 'assets/default-avatar.png'
            "
            alt="Foto de perfil"
            class="w-48 h-48 rounded-full object-cover"
          />
        </div>
  
        <!-- Información del usuario -->
        <div class="flex-1">
          <h2 class="text-2xl font-bold text-purple-600 mb-4">
            Información del Usuario
          </h2>
          <div class="grid grid-cols-2 gap-4">
            <!-- Campos de información -->
            <div>
              <label class="block text-gray-600 text-sm font-medium">Nombre:</label>
              <p class="text-lg text-gray-800 font-semibold">{{ user.nombre }}</p>
            </div>
            <div>
              <label class="block text-gray-600 text-sm font-medium">Apellido Paterno:</label>
              <p class="text-lg text-gray-800 font-semibold">
                {{ user.apellido_pat }}
              </p>
            </div>
            <div>
              <label class="block text-gray-600 text-sm font-medium">Apellido Materno:</label>
              <p class="text-lg text-gray-800 font-semibold">
                {{ user.apellido_mat }}
              </p>
            </div>
            <div>
              <label class="block text-gray-600 text-sm font-medium">Correo:</label>
              <p class="text-lg text-gray-800 font-semibold">{{ user.correo }}</p>
            </div>
          </div>
        </div>
      </div>
  
      <div class="mt-6 text-center">
        <button
          class="bg-purple-600 text-white py-2 px-6 rounded-md text-lg hover:bg-purple-700"
          (click)="toggleEdit()"
        >
          Editar Perfil
        </button>
      </div>
    </div>
  </div>
  
  <!-- Modal -->
  <div
    *ngIf="editing"
    class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50"
  >
    <div class="bg-purple-100 rounded-lg shadow-lg w-1/2 p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-purple-800">Editar Perfil</h2>
        <button
          class="text-gray-600 hover:text-gray-900"
          (click)="toggleEdit()"
        >
          ×
        </button>
      </div>
  
      <form (submit)="updateUser()">
        <div class="mb-4">
          <label for="nombre" class="block text-sm font-medium text-gray-700"
            >Nombre</label
          >
          <input
            type="text"
            id="nombre"
            [(ngModel)]="user.nombre"
            name="nombre"
            class="mt-1 p-2 w-full border rounded-md"
          />
        </div>
        <div class="mb-4">
          <label
            for="apellido_pat"
            class="block text-sm font-medium text-gray-700"
            >Apellido Paterno</label
          >
          <input
            type="text"
            id="apellido_pat"
            [(ngModel)]="user.apellido_pat"
            name="apellido_pat"
            class="mt-1 p-2 w-full border rounded-md"
          />
        </div>
        <div class="mb-4">
          <label
            for="apellido_mat"
            class="block text-sm font-medium text-gray-700"
            >Apellido Materno</label
          >
          <input
            type="text"
            id="apellido_mat"
            [(ngModel)]="user.apellido_mat"
            name="apellido_mat"
            class="mt-1 p-2 w-full border rounded-md"
          />
        </div>
        <div class="mb-4">
          <label for="imagen" class="block text-sm font-medium text-gray-700"
            >Foto de Perfil</label
          >
          <input
            type="file"
            id="imagen"
            (change)="onFileSelected($event)"
            class="mt-1 p-2 w-full border rounded-md"
          />
        </div>
        <div class="flex justify-between">
          <button
            type="button"
            (click)="toggleEdit()"
            class="bg-gray-300 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-400"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="bg-purple-600 text-white py-2 px-4 rounded-md hover:bg-purple-700"
          >
            Guardar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>
